<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <title>Custom New Tab</title>
  <style>
    body {
      overflow: hidden;
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background-color: #222;
      color: #fff;
      margin: 0;
      width: 100%;
      height: 100%;
    }

    #bgVideo {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      object-fit: cover;
      z-index: -1;
      background: #000;
    }

    .controls {
      position: relative;
      z-index: 10;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 30vh;
    }

    .uploadBtn {
      background-color: #ffffff;
      color: #333;
      padding: 12px 24px;
      font-size: 16px;
      font-weight: bold;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      transition: background 0.2s;
    }

    .uploadBtn:hover {
      background-color: #f0f0f0;
    }

    #videoInput {
      display: none;
    }

    form {
      width: 100%;
      max-width: 500px;
    }

    input[type="text"] {
      width: 100%;
      padding: 12px 20px;
      font-size: 16px;
      border: none;
      border-radius: 24px;
      background-color: #333;
      color: white;
      outline: none;
      box-size: border-box;
    }

    input[type="text"]:focus {
      background-color: #444;
      box-shadow: 0 0 8px rgba(255, 255, 255, 0.2);
    }
  </style>
</head>

<body>

  <video id="bgVideo" muted playsinline></video>
  <div class="controls">
    <label for="videoInput" class="uploadBtn">Upload Video</label>
    <input type="file" id="videoInput" accept="video/*">
  </div>
  <h1>Search the Web</h1>
  <form action="https://google.com" method="get">
    <input type="text" name="q" placeholder="Type a search and hit Enter..." autofocus autocomplete="off">
  </form>
  <script src="app.js"></script>
</body>

</html>
