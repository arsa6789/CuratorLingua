<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Custom New Tab</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background-color: #222;
      color: #fff;
      margin: 0;
    }
    form {
      width: 100%;
      max-width: 500px;
    }
    input[type="text"] {
      width: 100%;
      padding: 12px 20px;
      font-size: 16px;
      border: none;
      border-radius: 24px;
      background-color: #333;
      color: white;
      outline: none;
      box-size: border-box;
    }
    input[type="text"]:focus {
      background-color: #444;
      box-shadow: 0 0 8px rgba(255, 255, 255, 0.2);
    }
  </style>
</head>
<body>

  <h1>Search the Web</h1>
    <form action="https://google.com" method="get">
    <input type="text" name="q" placeholder="Type a search and hit Enter..." autofocus autocomplete="off">
  </form>

</body>
</html>
