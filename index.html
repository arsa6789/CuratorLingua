<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShadowCustomTab</title>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            display: grid;
            place-content: center;
            min-height: 100vh;
            margin: 0;
            background: #f4f4f5;
            color: #18181b;
        }
        .card {
            background: white;
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
            text-align: center;
            max-width: 400px;
        }
        a {
            display: inline-block;
            margin-top: 1rem;
            padding: 0.5rem 1rem;
            background: #2563eb;
            color: white;
            border-radius: 6px;
            text-decoration: none;
        }
        a:hover {
            background: #1d4ed8;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>ShadowCustomTab</h1>
        <p>A custom tab project by arsa6789.</p>
        <a href="https://github.com/arsa6789/ShadowCustomTab" target="_blank">View on GitHub</a>
    </div>
</body>
</html>
